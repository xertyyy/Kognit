    --glow-a:.58;
  }
}
:root[data-theme="dark"]{
  --blue:#2FD9C0; --accent-ink:#6CF0DB; --acc-rgb:47,217,192;
  --blue-t:rgba(47,217,192,.18); --green-ink:#5BE88A;
  --on-accent:#00231D;
  --a1:rgba(0,199,190,.22); --a2:rgba(48,209,88,.14); --a3:rgba(56,189,248,.18); --a4:rgba(167,139,250,.18); --a5:rgba(250,204,21,.08);
  --glow-a:.58;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 16px);-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.47;min-height:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:10px}
.ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60vmax 48vmax at -6% -8%, var(--a1), transparent 62%),
    radial-gradient(52vmax 44vmax at 108% 12%, var(--a3), transparent 62%),
    radial-gradient(58vmax 50vmax at 88% 108%, var(--a2), transparent 62%),
    radial-gradient(44vmax 40vmax at -8% 88%, var(--a4), transparent 62%);}

/* Glas */
.glass,.sheet{background-color:var(--glass);background-image:linear-gradient(180deg,var(--sheen),transparent 42%);
  -webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);
  border:1px solid var(--glass-edge);border-radius:26px;box-shadow:var(--glass-shadow), inset 0 1px 0 var(--spec)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass,.sheet{background-color:var(--glass-hi)}
}
.sheet,.pad{padding:18px}

/* Kopfzeile */
.top{max-width:760px;margin:0 auto;padding:14px 18px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px}
.countdown{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--label2);padding:7px 12px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glass-edge);max-width:calc(100% - 56px);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.countdown:empty{visibility:hidden}
.countdown b{color:var(--blue);font-weight:700}
.cd-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:0 0 8px;box-shadow:0 0 0 4px var(--blue-t)}
.themebtn{width:40px;height:40px;flex:0 0 40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--label);background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--spec)}
.themebtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Tab-Leiste */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
nav.tabs .bar{pointer-events:auto;display:flex;gap:2px;padding:6px;border-radius:999px;background-color:var(--glass-hi);background-image:linear-gradient(180deg,var(--sheen),transparent 55%);
  -webkit-backdrop-filter:blur(30px) saturate(200%);backdrop-filter:blur(30px) saturate(200%);border:1px solid var(--glass-edge);
  box-shadow:0 14px 40px rgba(0,0,0,.16), 0 2px 8px rgba(0,0,0,.08), inset 0 1px 0 var(--spec);max-width:100%}
nav.tabs button{flex:0 1 76px;min-width:58px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 8px 6px;border:0;background:none;border-radius:999px;color:var(--label2);font-size:10.5px;font-weight:600;letter-spacing:0;cursor:pointer;transition:background .2s,color .2s}
nav.tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--blue);background:var(--fill)}
nav.tabs button:disabled{opacity:.35;cursor:not-allowed}

main{max-width:760px;margin:0 auto;padding:6px 18px calc(var(--tabbar) + 48px + env(safe-area-inset-bottom,0px))}

/* Typo */
.lt{margin:10px 2px 20px}
.lt h1{font-family:var(--display);font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.022em;margin:0;text-wrap:balance}
.lt-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.meta-pills,.stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-edge);color:var(--label2);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.pill.accent{background:var(--blue-t);border-color:transparent;color:var(--blue)}
.pill.streak{background:var(--orange-t);border-color:transparent;color:var(--orange);font-size:14px}
.pill.score{background:var(--green-t);border-color:transparent;color:var(--green)}
.stats{margin-top:0}
h2,h3{font-family:var(--display);letter-spacing:-.015em}
.group-title{font-size:20px;font-weight:700;margin:28px 6px 10px}
.group-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:28px 6px 10px}
.group-head .group-title{margin:0}
.group-actions{display:flex;gap:4px}
.sub{color:var(--label2);margin:-8px 2px 18px;font-size:16px}
.hint{font-size:14px;color:var(--label2)}
.footnote{font-size:12.5px;color:var(--label3);text-align:center;margin:28px 12px 0}
p{margin:0 0 12px}

/* Listen im iOS-Stil */
.list{padding:4px 0;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:11px 16px;background:none;border:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
button.row:hover,.row-main:hover{background:none}
button.row:active{background:var(--fill)}
.list > .row + .row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.list > .row.ka + .row::before,.list > .row.topic + .row::before,.list > .row.ka + .row.add::before{left:68px}
.list > .row.ka + .row::before,.list > .row.ka + .row.add::before{left:108px}
.row.ka{cursor:default;padding-left:14px}
.ka-open{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;margin:0;text-align:left;color:inherit;font:inherit;cursor:pointer;transition:transform .55s var(--spring,ease)}
.ka-open:active{transform:scale(.985);transition-duration:.12s}
.st{background:linear-gradient(currentColor,currentColor) 0 58% / 0% 1.5px no-repeat;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size .5s cubic-bezier(.4,0,.2,1),color .35s}
.row.ka.done .st{background-size:100% 1.5px;color:var(--label3)}
.row.ka.done .row-sub{color:var(--label3)}
.row.ka .ring-mini{transition:opacity .35s,filter .35s}
.row.ka.done .ring-mini{opacity:.45;filter:saturate(.15)}
.pill.done-pill{background:rgba(52,199,89,.15);border-color:transparent;color:var(--green-ink,#1E7D3A)}
.pill.done-pill svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.row-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.row-title{font-weight:600;font-size:16.5px;line-height:1.3;color:var(--label)}
.row-sub{font-size:14px;color:var(--label2);display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.35}
.row-sub .muted{color:var(--label3)}
.chev{flex:0 0 auto;display:grid;color:var(--label3)}
.chev svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--fill);color:var(--label2)}
.tag.soon{background:var(--blue-t);color:var(--blue)}
.tag.grade{background:var(--purple-t);color:var(--purple)}
.row.past .row-title{color:var(--label2)}
.row.add{color:var(--blue);min-height:52px}
.row.add .row-title{color:var(--blue);font-weight:600}
.add-ic{width:40px;height:40px;flex:0 0 40px;border-radius:50%;display:grid;place-items:center;background:var(--blue-t);color:var(--blue);font-size:24px;font-weight:500;line-height:1}
.row.field{gap:10px;flex-wrap:wrap}
.row.field input{flex:1 1 200px}
.ring-mini{position:relative;flex:0 0 40px;width:40px;height:40px;display:grid;place-items:center}
.ring-mini svg{position:absolute;inset:0;width:40px;height:40px}
.ring-mini b{font-size:11.5px;font-weight:700;color:var(--label);font-variant-numeric:tabular-nums}

/* Ringe */
.ring circle{fill:none}
.ring .trk.rb{stroke:var(--blue-t)} .ring .prg.rb{stroke:var(--blue)}
.ring .trk.rg{stroke:var(--green-t)} .ring .prg.rg{stroke:var(--green)}
.ring .trk.ro{stroke:var(--orange-t)} .ring .prg.ro{stroke:var(--orange)}
.ring .trk.rr{stroke:var(--red-t)} .ring .prg.rr{stroke:var(--red)}
.ring .prg{stroke-linecap:round}
.anim .ring .prg{animation:ringin 1.1s cubic-bezier(.22,.9,.24,1) both}
.anim .ring .prg.rg{animation-delay:.12s}
@keyframes ringin{from{stroke-dashoffset:var(--C)}}

/* Übersicht */
.hero{display:flex;align-items:center;gap:24px;padding:22px 24px}
.hero-ring{position:relative;flex:0 0 auto;width:184px;height:184px}
.hero-ring svg{width:100%;height:100%}
.hero-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hero-center b{font-family:var(--display);font-size:36px;font-weight:700;line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.hero-center b small{font-size:18px;font-weight:600;letter-spacing:0;margin-left:1px}
.hero-center > span{font-size:13px;font-weight:600;color:var(--label2);margin-top:4px}
.hero-center b span{font:inherit;color:inherit;letter-spacing:inherit;margin:0}
.hero-legend{display:grid;gap:16px;min-width:0}
.legend-item{display:grid;grid-template-columns:12px 1fr;column-gap:10px;align-items:baseline}
.legend-item i{width:12px;height:12px;border-radius:50%;transform:translateY(1px)}
.legend-item i.rb{background:var(--blue)} .legend-item i.rg{background:var(--green)} .legend-item i.ro{background:var(--orange)} .legend-item i.rr{background:var(--red)} .legend-item i.rn{background:var(--label3)}
.legend-item b{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.legend-item span{font-size:15px;font-weight:600}
.legend-item small{grid-column:2;font-size:13px;color:var(--label2)}
.next{display:flex;align-items:center;gap:14px;width:100%;margin-top:14px;padding:14px 16px;text-align:left;cursor:pointer;color:inherit;font:inherit}
.next:active{transform:scale(.985)}
.next-ic,.exam-ic{width:42px;height:42px;flex:0 0 42px;border-radius:13px;display:grid;place-items:center;color:var(--on-accent);background:var(--blue);box-shadow:0 6px 16px var(--blue-t)}
.exam-ic{background:var(--purple);box-shadow:0 6px 16px var(--purple-t)}
.next-ic svg,.exam-ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.next .row-sub{font-size:13px}
.check{flex:0 0 28px;width:28px;height:28px;border-radius:50%;border:2px solid var(--label3);background:none;display:grid;place-items:center;cursor:pointer;padding:0;transition:background .2s,border-color .2s;margin-right:4px}
.check svg{width:16px;height:16px;fill:none;stroke:var(--on-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .2s}
.check.on{background:var(--green);border-color:var(--green)}
.check.on svg{opacity:1}
.row.topic.done .row-title{color:var(--label2)}
.lvl{width:8px;height:8px;border-radius:50%;background:var(--label3);display:inline-block}
.lvl.b-try{background:var(--blue)} .lvl.b-ok{background:var(--green)} .lvl.b-mid{background:var(--orange)} .lvl.b-low{background:var(--red)}
.pill-btn{flex:0 0 auto;border:0;background:var(--blue-t);color:var(--blue);font-weight:600;font-size:14.5px;padding:7px 14px;border-radius:999px;cursor:pointer}
.pill-btn:active{transform:scale(.96)}
details.settings{margin-top:26px;padding:14px 18px}
details.settings > summary{color:var(--label);font-weight:600;margin-top:0}
.row.topic{cursor:default}
details.settings .form{margin-top:14px}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--blue);color:var(--on-accent);font-weight:600;font-size:16px;line-height:1.2;padding:12px 20px;min-height:46px;border-radius:999px;cursor:pointer;transition:transform .12s,opacity .2s,background .2s;text-align:center}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.ghost{background:var(--fill);color:var(--blue)}
.btn.small{padding:8px 14px;min-height:36px;font-size:14.5px}
.btn.big{width:100%;min-height:52px;font-size:17px}
.btn.tinted{background:var(--green-t);color:var(--green)}
.btn.danger{background:var(--red-t);color:var(--red)}
#dlg .btn.danger{background:var(--red);color:var(--on-accent)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.linklike{background:none;border:0;padding:4px 6px;color:var(--blue);font-size:15px;font-weight:500;cursor:pointer}
.linklike.red{color:var(--red)}
.row-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 14px;padding:2px 18px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--glass-edge);background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);border-radius:999px;padding:8px 15px;font-size:14.5px;font-weight:600;color:var(--label2);cursor:pointer;transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--blue);color:var(--on-accent);border-color:transparent;box-shadow:0 6px 16px var(--blue-t)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.chip[aria-pressed="true"] .dot{background:var(--on-accent)}

/* Wissen */
article.kb{padding:26px 24px 24px}
.kb-title{font-size:28px;font-weight:700;line-height:1.15;margin:0 0 16px}
article.kb h3{font-size:20px;font-weight:700;margin:28px 0 8px}
article.kb .lead{font-size:18px;color:var(--label)}
article.kb ul,article.kb ol{padding-left:22px;margin:0 0 14px}
article.kb li{margin-bottom:6px}
article.kb p,article.kb li{max-width:68ch}
.kb-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;padding-top:18px;border-top:1px solid var(--sep)}
.tip,.ex{border-radius:16px;padding:12px 16px;margin:14px 0 16px}
.tip{background:var(--blue-t)}
.ex{background:var(--fill)}
.easy{border-radius:22px;padding:18px 18px 6px;margin:0 0 26px;background:linear-gradient(135deg,var(--green-t),var(--blue-t));border:1px solid var(--glass-edge)}
.easy h3{margin-top:0 !important;font-size:17px !important;color:var(--green)}
mark{padding:1px 6px;border-radius:6px;color:inherit}
mark.vom{background:var(--vom)} mark.im{background:var(--im)}
.tbl-wrap{overflow-x:auto;margin:8px 0 18px;border-radius:16px;background:var(--glass-hi);border:1px solid var(--sep)}
table.tbl{border-collapse:collapse;width:100%;font-size:15px}
table.tbl th{text-align:left;font-weight:600;font-size:13px;color:var(--label2);padding:10px 12px;border-bottom:1px solid var(--sep);white-space:nowrap}
table.tbl td{padding:9px 12px;border-bottom:1px solid var(--sep);vertical-align:top}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tr.sum td{font-weight:700}
table.tbl tr.hl td{background:var(--blue-t)}
table.num td:not(:first-child){font-variant-numeric:tabular-nums;white-space:nowrap}
pre.code,article.kb pre{font-family:var(--mono);font-size:14.5px;line-height:1.55;background:var(--code-bg);border:1px solid var(--sep);border-radius:14px;padding:12px 14px;overflow-x:auto;white-space:pre;margin:6px 0 16px;tab-size:4;color:var(--label)}
code{font-family:var(--mono);font-size:.9em;background:var(--code-bg);padding:1px 6px;border-radius:6px}
pre code{background:none;padding:0;font-size:inherit}
details summary{cursor:pointer;color:var(--blue);font-weight:600;margin-top:12px}

/* Quiz */
.qbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.seg{display:inline-flex;background:var(--fill);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--label2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--glass-hi);color:var(--label);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.seg-label{display:none}
.gen{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:13px;color:var(--label2)}
.qprog{height:6px;border-radius:999px;background:var(--fill);overflow:hidden;margin:0 0 14px}
.qprog i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .45s cubic-bezier(.2,.8,.2,1)}
.qcard{padding:20px}
.qcard.empty,.summary{text-align:center;padding:30px 22px}
.qmeta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--label2);margin-bottom:10px;flex-wrap:wrap}
.qtopic{font-weight:600}
.qcount{margin-left:auto;font-variant-numeric:tabular-nums}
.newtag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--purple-t);color:var(--purple)}
.qkind{font-size:13px;font-weight:600;color:var(--label2);margin:0 0 4px}
.qtext{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.3;letter-spacing:-.012em;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--glass-hi);border:1.5px solid transparent;border-radius:16px;padding:12px 14px;font-size:16.5px;font-weight:500;color:var(--label);cursor:pointer;transition:border-color .15s,background .15s,transform .12s;box-shadow:inset 0 1px 0 var(--spec)}
.opt:not(:disabled):hover{border-color:var(--fill2)}
.opt:not(:disabled):active{transform:scale(.985)}
.opt .k{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--fill);font-size:13.5px;font-weight:700;color:var(--label2);transition:background .15s,color .15s}
.opt.sel{border-color:var(--blue);background:var(--blue-t)}
.opt.sel .k{background:var(--blue);color:var(--on-accent)}
.opt.right{border-color:var(--green);background:var(--green-t)}
.opt.right .k{background:var(--green);color:var(--on-accent)}
.opt.wrong{border-color:var(--red);background:var(--red-t)}
.opt.wrong .k{background:var(--red);color:var(--on-accent)}
.opt:disabled{cursor:default}
.opt .mono{font-family:var(--mono);font-size:15px;white-space:pre-wrap}
.qcard.pop .opt.right{animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.qcard.shake .opt.wrong{animation:shake .42s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.action-bar{position:sticky;bottom:calc(var(--tabbar) + 18px + env(safe-area-inset-bottom,0px));z-index:5;margin-top:14px;padding:12px;display:grid;gap:10px;border-radius:26px}
.action-bar.flow{position:relative;bottom:auto}
.action-bar .btn{width:100%}
.action-bar .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.action-bar .three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.verdict{padding:4px 6px 0}
.verdict b{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;margin-bottom:2px}
.verdict.good b{color:var(--green)} .verdict.bad b{color:var(--red)} .verdict.neutral b{color:var(--label)}

.board-card{margin-bottom:6px}

.pill-btn.alt.danger-pill{color:var(--red,#FF3B30);border-color:rgba(255,59,48,.35)}
.admin-tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:rgba(var(--acc-rgb),.14);padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
html.touring,html.touring body{overflow:hidden}
#tour{position:fixed;inset:0;z-index:1000}

.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:46px;padding:0 18px;border-radius:999px;border:1px solid #DADCE0;background:#FFFFFF;color:#1F1F1F;font:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:background .2s,transform .12s}

.login-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.login-actions .btn{width:100%}
#dlg{border:1px solid var(--glass-edge);border-radius:26px;padding:22px;background:var(--glass-hi);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);color:var(--label);max-width:min(420px,calc(100% - 32px));box-shadow:0 30px 80px rgba(0,0,0,.3)}

@keyframes fall{0%{opacity:1;transform:translate3d(0,0,0) rotate(0)}100%{opacity:.95;transform:translate3d(var(--dx),110vh,0) rotate(var(--rot))}}


/* ---------- Bewegung im Apple-Stil ---------- */
:root{--spring:cubic-bezier(.34,1.56,.64,1);--spring-soft:cubic-bezier(.22,1,.36,1)}
@supports (transition-timing-function: linear(0, 1)){
  :root{
    --spring:linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1);
    --spring-soft:linear(0, .006, .025 2.8%, .101 6.1%, .539 18.9%, .721 25.3%, .849 31.5%, .937 38.1%, .968 41.8%, .991 45.7%, 1.006 50.1%, 1.015 55%, 1.017 63.9%, 1.001);
  }
}
/* Nachgeben beim Antippen */
.btn,.chip,.opt,.pill-btn,.check,.themebtn,nav.tabs button,.next,button.row,.row-main,.exam-dots .dot{
  transition:transform .55s var(--spring),background-color .25s,border-color .25s,color .25s,box-shadow .25s,opacity .25s}
.btn:active,.chip:active,.pill-btn:active,.themebtn:active,nav.tabs button:active{transform:scale(.92);transition-duration:.12s,.25s,.25s,.25s,.25s,.25s}
.opt:not(:disabled):active,.next:active{transform:scale(.97);transition-duration:.12s,.25s,.25s,.25s,.25s,.25s}
button.row:active,.row-main:active{transform:scale(.985);transition-duration:.12s,.25s,.25s,.25s,.25s,.25s}
.check:active{transform:scale(.82);transition-duration:.1s,.25s,.25s,.25s,.25s,.25s}
.btn:disabled:active{transform:none}

/* Glas-Tropfen in der Tab-Leiste */
nav.tabs .bar{position:relative}
nav.tabs button{position:relative;z-index:1}
nav.tabs button[aria-current="page"]{background:none}
.lens{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:999px;z-index:0;pointer-events:none;opacity:0;
  background:var(--fill);box-shadow:inset 0 1px 0 var(--spec), 0 2px 10px rgba(0,0,0,.06);
  transition:transform .6s var(--spring-soft),width .6s var(--spring-soft),opacity .25s}
.lens.on{opacity:1}
.lens.stretch{transition:transform .18s cubic-bezier(.4,0,.2,1),width .18s cubic-bezier(.4,0,.2,1),opacity .25s}
.lens.instant{transition:none}

/* Kleiner Titel beim Scrollen */
.navbar{position:fixed;top:0;left:0;right:0;z-index:25;padding:calc(env(safe-area-inset-top,0px) + 12px) 64px 12px;text-align:center;font-weight:600;font-size:17px;letter-spacing:-.01em;color:var(--label);
  background-color:var(--glass-hi);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border-bottom:1px solid var(--sep);
  opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .25s ease,transform .5s var(--spring-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbar.show{opacity:1;transform:none}

/* Seitenwechsel */
main{view-transition-name:main}
nav.tabs .bar{view-transition-name:tabbar}
.timer-fab{view-transition-name:timerfab}
.set-fab{view-transition-name:setfab}
::view-transition-old(setfab){display:none}
::view-transition-new(setfab){animation:none}
.set-fab.on{color:var(--label)}
.set-fab.on .ic{color:var(--accent-ink);filter:drop-shadow(0 0 6px rgba(var(--acc-rgb),.6))}
.set-fab.on .lb{color:var(--accent-ink)}
::view-transition-old(timerfab){display:none}
::view-transition-new(timerfab){animation:none}
::view-transition-old(root),::view-transition-new(root){animation-duration:.25s}
::view-transition-old(main){animation:vt-out .2s ease both}
::view-transition-new(main){animation:vt-in .55s var(--spring-soft) both}
html[data-dir="fwd"]::view-transition-new(main){animation-name:vt-in-r}
html[data-dir="back"]::view-transition-new(main){animation-name:vt-in-l}
::view-transition-old(tabbar){display:none}
::view-transition-new(tabbar){animation:none}
html[data-dir="theme"]::view-transition-old(main),html[data-dir="theme"]::view-transition-old(tabbar){display:block;animation:fade-out .4s ease both}
html[data-dir="theme"]::view-transition-new(main),html[data-dir="theme"]::view-transition-new(tabbar){animation:fade-in .4s ease both}
main.enter{animation:vt-in .55s var(--spring-soft) both}
main.enter[data-dir="fwd"]{animation-name:vt-in-r}
main.enter[data-dir="back"]{animation-name:vt-in-l}
@keyframes vt-out{to{opacity:0;transform:scale(.98)}}
@keyframes vt-in{from{opacity:0;transform:translateY(14px)}}
@keyframes vt-in-r{from{opacity:0;transform:translateX(34px)}}
@keyframes vt-in-l{from{opacity:0;transform:translateX(-34px)}}
@keyframes fade-in{from{opacity:0}}
@keyframes fade-out{to{opacity:0}}

/* Inhalte innerhalb einer Ansicht */
.enter-card{animation:card-in .55s var(--spring-soft) both}
.enter-card-back{animation:card-in-back .55s var(--spring-soft) both}
.enter-fade{animation:fade-up .5s var(--spring-soft) both}
.enter-swap{animation:swap-in .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes swap-in{from{opacity:0;transform:translateY(6px)}}
@keyframes card-in{from{opacity:0;transform:translateX(40px) scale(.98)}}
@keyframes card-in-back{from{opacity:0;transform:translateX(-40px) scale(.98)}}
@keyframes fade-up{from{opacity:0;transform:translateY(12px)}}
.action-bar .verdict{animation:rise .55s var(--spring) both}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.97)}}
.check.bump{animation:check-pop .55s var(--spring)}
/* Abhaken: kleine Belohnung */
.btn,.check{position:relative}
.done-pop{animation:done-pop .6s var(--spring)}
@keyframes done-pop{0%{transform:scale(.92)}45%{transform:scale(1.06)}100%{transform:scale(1)}}
.done-pop::after,.check.bump.on::after{content:"";position:absolute;inset:-2px;border-radius:inherit;pointer-events:none;animation:ring-out .75s ease-out forwards}
@keyframes ring-out{0%{box-shadow:0 0 0 0 rgba(52,199,89,.55)}100%{box-shadow:0 0 0 14px rgba(52,199,89,0)}}
.done-pop svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .42s .1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.spark{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--c);pointer-events:none;box-shadow:0 0 6px var(--c);animation:spark .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes spark{0%{opacity:1;transform:translate(calc(var(--x) * .55),calc(var(--y) * .55)) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.3)}}
.dot-pop{animation:dot-pop .5s var(--spring)}
@keyframes dot-pop{from{transform:scale(0)}}
@keyframes check-pop{0%{transform:scale(.55)}100%{transform:scale(1)}}
.pill.streak.bump{animation:streak-pop .65s var(--spring)}
@keyframes streak-pop{0%{opacity:0;transform:scale(.4) rotate(-12deg)}100%{opacity:1;transform:none}}
.qprog i{transition:width .7s var(--spring-soft)}
#toast:not([hidden]){animation:toast-in .55s var(--spring) both}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,28px) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
#dlg[open]{animation:alert-in .4s var(--spring) both}
#dlg[open]::backdrop{animation:fade-in .25s ease both}
@keyframes alert-in{from{opacity:0;transform:scale(1.14)}}
.themebtn.spin svg{animation:spin-in .65s var(--spring)}
@keyframes spin-in{from{opacity:0;transform:rotate(-120deg) scale(.4)}}
.anim .hero-center b,.ring-big.anim .hero-center b{animation:num-in .7s var(--spring-soft) both}
@keyframes num-in{from{opacity:0;transform:scale(.85)}}

/* ---------- Farben und Glow ---------- */
.ambient{background:
  radial-gradient(58vmax 46vmax at -6% -8%, var(--a1), transparent 62%),
  radial-gradient(50vmax 42vmax at 108% 8%, var(--a3), transparent 62%),
  radial-gradient(56vmax 48vmax at 92% 108%, var(--a2), transparent 62%),

/* Knöpfe aus getöntem Glas */
.btn{background:rgba(var(--acc-rgb),.17);color:var(--accent-ink);border:1px solid rgba(var(--acc-rgb),.32);

.chip[aria-pressed="true"] .dot{background:var(--green)}

.pill.accent{background:rgba(var(--acc-rgb),.14)}
.exam-ic{color:#FFFFFF}
.lens{background:rgba(var(--acc-rgb),.16);box-shadow:inset 0 1px 0 var(--spec), 0 0 16px -2px rgba(var(--acc-rgb),.45)}
/* Quiz: richtig und falsch glühen */
.opt.right{box-shadow:0 0 0 1px var(--green), 0 0 26px -2px rgba(52,199,89,.62), inset 0 1px 0 var(--spec)}
.opt.wrong{box-shadow:0 0 0 1px var(--red), 0 0 26px -2px rgba(255,59,48,.55), inset 0 1px 0 var(--spec)}

.qcard.pop .opt.right{animation:pop .5s var(--spring), glow-good 1.3s ease-out}
.qcard.shake .opt.wrong{animation:shake .42s ease, glow-bad 1.3s ease-out}
@keyframes glow-good{0%{box-shadow:0 0 0 1px var(--green), 0 0 60px 10px rgba(52,199,89,.75)}}

/* Siri-Regenbogenrand um die Tab-Leiste */

/* ---------- D1 Fachfarbe für Akzente ---------- */
.qprog i{background:linear-gradient(90deg,var(--fach),var(--green))}
.exam-dots .dot.a{background:var(--fach)}
.exam-dots .dot.c{box-shadow:0 0 0 3px rgba(var(--fach-rgb),.25)}
.lens{background:rgba(var(--fach-rgb),.16);box-shadow:inset 0 1px 0 var(--spec), 0 0 16px -2px rgba(var(--fach-rgb),.45)}
.minibar i{background:var(--fach)}
/* ---------- D2 Themen-Icons ---------- */
.ticon{display:inline-grid;place-items:center;flex:0 0 auto;color:var(--fach)}
.ticon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- D3 Lernpfad ---------- */
.path{padding:10px 0}
.step{position:relative;display:flex;align-items:center;gap:14px;padding:10px 16px}
.step:not(:last-child)::before{content:"";position:absolute;left:39px;top:calc(50% + 24px);height:calc(100% - 48px);width:3px;margin-left:-1.5px;border-radius:2px;background:var(--fill2)}
.step.done:not(:last-child)::before{background:linear-gradient(var(--fach),rgba(var(--fach-rgb),.45))}
.node{position:relative;flex:0 0 48px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;
  background:var(--glass-hi);border:2px solid var(--fill2);color:var(--label2)}
.node svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.step.cur .node{border-color:var(--fach);color:var(--fach);animation:halo 2.6s ease-in-out infinite}
@keyframes halo{0%,100%{box-shadow:0 0 0 0 rgba(var(--fach-rgb),.35)}50%{box-shadow:0 0 0 9px rgba(var(--fach-rgb),0)}}
.step.done .node{background:var(--fach);border-color:var(--fach);color:#FFFFFF;box-shadow:0 6px 18px -6px rgba(var(--fach-rgb),.8)}
.node .badge-ok{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;background:var(--green);display:grid;place-items:center;border:2px solid var(--bg);opacity:0;transform:scale(.4);transition:opacity .2s,transform .45s var(--spring)}

.step.done .node .badge-ok{opacity:1;transform:none}
.step.done .row-title{color:var(--label2)}
.step .row-main{padding:4px 0}
/* ---------- D4 Inhaltsverzeichnis ---------- */
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:4;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -10px 18px;padding:7px;border-radius:999px;
  background:var(--glass-hi);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glass-edge);box-shadow:0 6px 20px -10px rgba(0,0,0,.2)}
.toc::-webkit-scrollbar{display:none}

    transition:transform .55s var(--spring-soft),height .55s var(--spring-soft),opacity .25s}
  .ts-ind::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--fach);box-shadow:0 0 10px rgba(var(--fach-rgb),.8)}

/* ---------- D6 Merk-Boxen ---------- */
.box{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;border-radius:16px;padding:12px 14px;border:1px solid transparent;margin:14px 0 16px}

.alt-btn{margin:0 0 14px}

.alt-head{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;margin-bottom:8px}

#imp-prompt{min-height:90px;font-size:13px}
.alt-head .sp{display:inline-grid;color:var(--fach)} .alt-head svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round}

@keyframes shimmer{to{background-position:-200% 0}}
/* ---------- F9 Statistik und D8 Lernkalender ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.metric{padding:14px 16px;display:flex;flex-direction:column;gap:2px}

.card-title small{font-weight:500;font-size:13px;color:var(--label2)}
.stat-card{margin-top:10px;padding:16px 18px}
.cal{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:4px;overflow-x:auto;padding-bottom:2px}
.cal i{width:14px;height:14px;border-radius:4px;background:var(--fill)}
.cal i.l1{background:rgba(var(--fach-rgb),.35)} .cal i.l2{background:rgba(var(--fach-rgb),.65)} .cal i.l3{background:var(--fach);box-shadow:0 0 8px rgba(var(--fach-rgb),.6)}

.cal-legend .l1{background:rgba(var(--fach-rgb),.35)} .cal-legend .l2{background:rgba(var(--fach-rgb),.65)} .cal-legend .l3{background:var(--fach)}
.cal-legend .grow{flex:1}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--sep);stroke-width:1}
.chart .ln{fill:none;stroke:var(--fach);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(var(--fach-rgb),.6))}
.chart .ar{fill:rgba(var(--fach-rgb),.12)}
.chart .pt{fill:var(--fach);stroke:var(--bg);stroke-width:2}
.chart text{font-size:11px;fill:var(--label2);font-family:var(--font)}
.chart text.gr{font-weight:700;fill:var(--label)}
/* ---------- F3 Fokus-Timer ---------- */
nav.tabs{align-items:center;gap:10px}
.timer-fab{pointer-events:auto;position:relative;flex:0 0 56px;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--label);padding:0;
  background-color:var(--glass-hi);background-image:linear-gradient(180deg,var(--sheen),transparent 55%);-webkit-backdrop-filter:blur(30px) saturate(200%);backdrop-filter:blur(30px) saturate(200%);
  border:1px solid var(--glass-edge);box-shadow:0 14px 40px rgba(0,0,0,.16), inset 0 1px 0 var(--spec);transition:transform .55s var(--spring)}
.timer-fab:active{transform:scale(.9);transition-duration:.12s}
.timer-fab .ring{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px)}
.timer-fab .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.timer-fab .tm{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.timer-fab{flex:0 0 auto;width:auto;height:auto;min-width:66px;padding:13px 10px 12px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--label2);font-size:10.5px;font-weight:600;line-height:1.2;
  box-shadow:0 14px 40px rgba(0,0,0,.14), inset 0 1px 0 var(--spec),
    -10px 0 26px -12px rgba(255,159,10,.5), 10px 0 26px -12px rgba(10,132,255,.5), 0 -8px 24px -14px rgba(191,90,242,.5), 0 10px 24px -14px rgba(52,199,89,.45)}
.timer-fab::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.8px;pointer-events:none;z-index:2;
  background:conic-gradient(from var(--siri),#FF9F0A,#FF375F,#BF5AF2,#0A84FF,#00C7BE,#34C759,#FF9F0A);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
  animation:siri 9s linear infinite}
.timer-fab .ic{display:grid}
.timer-fab .ic svg{width:24px;height:24px;stroke-width:1.8}

.timer-sheet:not([hidden]){animation:sheet-in .45s var(--spring) both}
@keyframes sheet-in{from{opacity:0;transform:translate(-50%,20px) scale(.94)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.timer-sheet .t-ring{position:relative;width:150px;height:150px;margin:6px auto 12px}

<script>
// Rechenkern: Handelskalkulation, jeder Zwischenschritt kaufmännisch auf 2 Stellen gerundet
const r2 = v => Math.round(+(v * 100).toFixed(6)) / 100;
const pc = v => +(v || 0);

const LBL = {
  lep: 'Listeneinkaufspreis', rab: 'Liefererrabatt', zep: 'Zieleinkaufspreis', sk: 'Liefererskonto',
  bep: 'Bareinkaufspreis', bk: 'Bezugskosten', bp: 'Bezugspreis (Einstandspreis)', hk: 'Handlungskosten',
  skp: 'Selbstkosten', g: 'Gewinn', bvp: 'Barverkaufspreis', ksk: 'Kundenskonto', prov: 'Vertreterprovision',
  zvp: 'Zielverkaufspreis', kr: 'Kundenrabatt', lvp: 'Listenverkaufspreis (netto)', ust: 'Umsatzsteuer',
  brutto: 'Listenverkaufspreis (brutto)'
};
const SIGN = { rab: '−', sk: '−', bk: '+', hk: '+', g: '+', ksk: '+', prov: '+', kr: '+', ust: '+' };

function salesEnd(p) { return pc(p.kr) ? 'lvp' : (pc(p.ksk) || pc(p.prov)) ? 'zvp' : 'bvp'; }

// Werte von oben nach unten
function forwardTop(p, v) {
  if (p.bp != null) { v.bp = r2(p.bp); return; }
  v.lep = r2(p.lep); v.rab = r2(v.lep * pc(p.rab) / 100); v.zep = r2(v.lep - v.rab);
  v.sk = r2(v.zep * pc(p.sk) / 100); v.bep = r2(v.zep - v.sk); v.bk = r2(pc(p.bk)); v.bp = r2(v.bep + v.bk);
}
function forwardMid(p, v) { v.hk = r2(v.bp * pc(p.hk) / 100); v.skp = r2(v.bp + v.hk); }
function forwardSales(p, v) {
  v.g = r2(v.skp * pc(p.g) / 100); v.bvp = r2(v.skp + v.g);
  const a = pc(p.ksk) + pc(p.prov);
  if (a) { v.zvp = r2(v.bvp / (1 - a / 100)); v.ksk = r2(v.zvp * pc(p.ksk) / 100); v.prov = r2(v.zvp - v.bvp - v.ksk); }
  else v.zvp = v.bvp;
  if (pc(p.kr)) { v.lvp = r2(v.zvp / (1 - pc(p.kr) / 100)); v.kr = r2(v.lvp - v.zvp); } else v.lvp = v.zvp;
  if (p.ust) { v.ust = r2(v.lvp * 0.19); v.brutto = r2(v.lvp + v.ust); }
}
// Werte von unten nach oben bis zum Barverkaufspreis
function backwardSales(p, v) {
  let netto;
  if (p.brutto != null) { v.brutto = r2(p.brutto); netto = r2(v.brutto / 1.19); v.ust = r2(v.brutto - netto); }
  else netto = r2(p.netto);
  v.lvp = netto;
  if (pc(p.kr)) { v.kr = r2(netto * pc(p.kr) / 100); v.zvp = r2(netto - v.kr); } else v.zvp = netto;
  v.ksk = r2(v.zvp * pc(p.ksk) / 100); v.prov = r2(v.zvp * pc(p.prov) / 100);
  v.bvp = r2(v.zvp - v.ksk - v.prov);
}
function backwardRest(p, v, stop) {
  v.skp = r2(v.bvp / (1 + pc(p.g) / 100)); v.g = r2(v.bvp - v.skp);
  v.bp = r2(v.skp / (1 + pc(p.hk) / 100)); v.hk = r2(v.skp - v.bp);
  if (stop === 'bp') return;
  v.bk = r2(pc(p.bk)); v.bep = r2(v.bp - v.bk);
  v.zep = r2(v.bep / (1 - pc(p.sk) / 100)); v.sk = r2(v.zep - v.bep);
  v.lep = r2(v.zep / (1 - pc(p.rab) / 100)); v.rab = r2(v.lep - v.zep);
}

function rateText(k, p) {
  const m = { rab: p.rab, sk: p.sk, hk: p.hk, g: p.g, ksk: p.ksk, prov: p.prov, kr: p.kr };
  if (k === 'ust') return '19 %';
  return m[k] != null && k in m ? String(m[k]).replace('.', ',') + ' %' : '';
}

// Zeilenliste in Schema-Reihenfolge
function buildRows(task, v) {
  const p = task.p, kind = task.kind, rows = [];
  const add = (k, given) => rows.push({ key: k, label: LBL[k], sign: SIGN[k] || (k === 'lep' || (k === 'bp' && p.bp != null) ? '' : '='), rate: rateText(k, p), value: v[k], given: !!given });
  const top = () => {
    if (p.bp != null) { add('bp', true); return; }
    add('lep', kind !== 'rueck'); if (pc(p.rab)) add('rab'); add('zep'); if (pc(p.sk)) add('sk'); add('bep');
    if (pc(p.bk)) add('bk', true); add('bp');
  };
  const sales = (givenBottom) => {
    add('bvp');
    if (pc(p.ksk)) add('ksk'); if (pc(p.prov)) add('prov'); if (pc(p.ksk) || pc(p.prov)) add('zvp');
    if (pc(p.kr)) add('kr'); if (pc(p.kr)) add('lvp');
    if (p.ust || p.brutto != null) { add('ust'); add('brutto', givenBottom); }
    if (givenBottom && !(p.ust || p.brutto != null)) {
      const end = salesEnd(p); const row = rows.find(r => r.key === end); if (row) { row.given = true; if (end !== 'lvp') row.label += ' (netto)'; }
    }
  };
  if (kind === 'bezug') top();
  else if (kind === 'vor') { top(); add('hk'); add('skp'); add('g'); sales(false); }
  else if (kind === 'rueck') {
    if (task.stop !== 'bp') top(); else add('bp');
    add('hk'); add('skp'); add('g'); sales(true);
  } else if (kind === 'diff') { top(); add('hk'); add('skp'); add('g'); sales(true); }
  // Bei Bezugskosten in Rückwärts: gegeben
  rows.forEach(r => { if (r.key === 'bk') r.given = true; });
  // Barverkaufspreis als Netto kennzeichnen, wenn keine Verkaufsnachlässe
  if (kind !== 'bezug') { const e = salesEnd(p); const r = rows.find(x => x.key === e); if (r && e !== 'lvp' && (p.ust || p.brutto != null) && !/netto/.test(r.label)) r.label += ' (netto)'; }
  return rows;
}

function solve(task) {
  const p = task.p, v = {};
  if (task.kind === 'bezug') forwardTop(p, v);
  else if (task.kind === 'vor') { forwardTop(p, v); forwardMid(p, v); forwardSales(p, v); }
  else if (task.kind === 'rueck') { backwardSales(p, v); backwardRest(p, v, task.stop); }
  else if (task.kind === 'diff') {
    forwardTop(p, v); forwardMid(p, v); backwardSales(p, v);
    v.g = r2(v.bvp - v.skp); v.gz = r2(v.g / v.skp * 100);
  }
  const rows = buildRows(task, v);
  let ask;
  if (task.kind === 'bezug') ask = ['bp'];
  else if (task.kind === 'vor') ask = [p.ust ? 'brutto' : salesEnd(p)];
  else if (task.kind === 'rueck') ask = task.stop === 'bp' ? ['bp'] : ['bp', 'lep'];
  else ask = ['g', 'gz'];
  if (task.ask) ask = task.ask;
  const answers = ask.map(k => ({ key: k, label: k === 'gz' ? 'Gewinnzuschlag' : (rows.find(r => r.key === k) || { label: LBL[k] }).label, value: v[k], unit: k === 'gz' ? '%' : '€' }));
  return { v, rows, answers };
}

{ id: 'grund', title: 'Grundbegriffe', short: 'Netto, Rabatt, Skonto und Co.', html: `
<div class="easy"><h3>Einfach erklärt</h3>
<p>Stell dir einen <b>Fahrradladen</b> vor. Er kauft ein Rad beim Hersteller und verkauft es an einen Kunden. Jeder Begriff beantwortet eine einfache Frage auf diesem Weg.</p>
<div class="tbl-wrap"><table class="tbl"><tr><th>Begriff</th><th>Die Frage dahinter</th></tr>
<tr><td>netto / brutto</td><td>Preis ohne / mit Mehrwertsteuer?</td></tr>
<tr><td>Rabatt</td><td>Wie viel gibt’s weniger, weil ich viel kaufe oder Stammkunde bin?</td></tr>
<tr><td>Skonto</td><td>Wie viel gibt’s weniger, weil ich schnell zahle?</td></tr>
<tr><td>Bezugskosten</td><td>Was kostet die Spedition, die das Rad bringt?</td></tr>
<tr><td>Bezugspreis</td><td>Was kostet das Rad, wenn es in meinem Laden steht?</td></tr>
<tr><td>Handlungskosten</td><td>Was kostet mein Laden: Miete, Lohn, Strom?</td></tr>
<tr><td>Selbstkosten</td><td>Ab welchem Preis verliere ich kein Geld mehr?</td></tr>
<tr><td>Gewinn</td><td>Was will ich verdienen?</td></tr>
</table></div>
<p><b>Merke:</b> Rabatt = Geschenk für Menge oder Treue. Skonto = Bonus für Schnellzahler.</p></div>
<h3>Genauer erklärt</h3>
<p class="lead">Bevor du rechnest, musst du die Wörter verstehen. Stell dir vor: Du arbeitest bei einem Händler. Er kauft Laptops bei einem Lieferanten ein und verkauft sie an Kunden weiter. Fast alle Begriffe beschreiben einen Schritt auf diesem Weg.</p>
<h3>Netto, brutto, Umsatzsteuer</h3>
<ul>
<li><b>Netto</b> heißt: ohne Steuer. <b>Brutto</b> heißt: mit Steuer.</li>
<li><b>Umsatzsteuer (USt)</b> und <b>Mehrwertsteuer (MwSt)</b> sind dasselbe. In Deutschland meist 19 %.</li>
<li>Firmen rechnen untereinander fast immer netto. Steht im Angebot „zzgl. 19 % USt“, ist der Preis netto.</li>
<li>Rechnen: netto × 1,19 = brutto. Zurück: brutto ÷ 1,19 = netto.</li>
</ul>
<div class="ex"><b>Beispiel:</b> Ein Laptop kostet 500,00 € netto. Brutto sind das 500,00 × 1,19 = 595,00 €.</div>
<h3>Beim Einkaufen (du kaufst beim Lieferanten)</h3>
<table class="tbl"><tr><th>Begriff</th><th>Was es bedeutet</th></tr>
<tr><td>Lieferer / Lieferant</td><td>Die Firma, bei der du einkaufst.</td></tr>
<tr><td>Listeneinkaufspreis</td><td>Der normale Preis aus der Preisliste oder dem Angebot.</td></tr>
<tr><td>Liefererrabatt</td><td>Preisnachlass vom Lieferanten, zum Beispiel weil du viel kaufst (Mengenrabatt) oder Stammkunde bist (Treuerabatt).</td></tr>
<tr><td>Zieleinkaufspreis</td><td>Preis nach Rabatt. „Ziel“ heißt: Du darfst später zahlen, etwa in 30 Tagen.</td></tr>
<tr><td>Liefererskonto</td><td>Kleiner Nachlass, wenn du schnell zahlst, etwa 2 % bei Zahlung in 10 Tagen.</td></tr>
<tr><td>Bareinkaufspreis</td><td>Preis nach Rabatt und Skonto. „Bar“ heißt: sofort bezahlt.</td></tr>
<tr><td>Bezugskosten</td><td>Kosten, um die Ware zu dir zu bekommen: Versand, Fracht, Transport, Versandverpackung.</td></tr>
<tr><td>Bezugspreis = Einstandspreis</td><td>Was dich die Ware wirklich kostet, bis sie bei dir ist. Zwei Namen, ein Begriff.</td></tr>
</table>
<div class="tip"><b>Rabatt oder Skonto?</b> Rabatt bekommst du immer, egal wann du zahlst. Skonto bekommst du nur, wenn du schnell zahlst. Deshalb wird der Rabatt immer zuerst abgezogen.</div>
<h3>In deiner eigenen Firma</h3>
<table class="tbl"><tr><th>Begriff</th><th>Was es bedeutet</th></tr>
<tr><td>Handlungskosten</td><td>Alle Kosten deiner eigenen Firma: Miete, Löhne, Strom, Lager, Büro. Sie heißen auch Handelskosten. Die Bezugskosten gehören nicht dazu.</td></tr>
<tr><td>Handlungskostenzuschlag</td><td>Diese Kosten als Prozentsatz, der auf jeden Artikel draufgerechnet wird.</td></tr>
<tr><td>Selbstkosten</td><td>Bezugspreis plus Handlungskosten. Wer darunter verkauft, macht Verlust.</td></tr>
<tr><td>Gewinn / Gewinnzuschlag</td><td>Was du verdienen willst, als Prozentsatz auf die Selbstkosten.</td></tr>
</table>
<h3>Beim Verkaufen (du verkaufst an deinen Kunden)</h3>
<table class="tbl"><tr><th>Begriff</th><th>Was es bedeutet</th></tr>
<tr><td>Barverkaufspreis</td><td>Was du am Ende wirklich in der Kasse haben willst.</td></tr>
<tr><td>Kundenskonto</td><td>Nachlass, den du deinem Kunden für schnelles Zahlen gibst.</td></tr>
<tr><td>Vertreterprovision</td><td>Geld für einen Vertreter, der den Verkauf vermittelt hat.</td></tr>
<tr><td>Zielverkaufspreis</td><td>Preis, wenn der Kunde später zahlt, also vor Skonto.</td></tr>
<tr><td>Kundenrabatt</td><td>Preisnachlass, den du deinem Kunden gibst.</td></tr>
<tr><td>Listenverkaufspreis</td><td>Der Preis in deinem Angebot an den Kunden. Netto ohne Steuer, brutto mit 19 % Umsatzsteuer.</td></tr>
</table>
<h3>Die drei Arten zu rechnen</h3>
<ul>
<li><b>Vorwärtskalkulation:</b> Du kennst den Einkaufspreis und suchst den Verkaufspreis. Von oben nach unten.</li>
<li><b>Rückwärtskalkulation:</b> Du kennst den Verkaufspreis, zum Beispiel von der Konkurrenz, und suchst, wie viel du beim Einkauf höchstens zahlen darfst. Von unten nach oben.</li>
<li><b>Differenzkalkulation:</b> Du kennst beides und suchst den Gewinn. Von beiden Seiten zur Mitte.</li>
</ul>` },

{ id: 'schema', title: 'Kalkulationsschema', short: 'Die 18 Zeilen zum Auswendiglernen', html: `
<div class="easy"><h3>Einfach erklärt</h3>
<p>Das Schema ist einfach die Fahrrad-Geschichte von oben nach unten. Lies die rechte Spalte wie eine Geschichte:</p>
<div class="tbl-wrap"><table class="tbl num"><tr><th>Zeile</th><th>Betrag</th><th>Was passiert</th></tr>
<tr><td>Listeneinkaufspreis</td><td>1.000,00 €</td><td>Preis im Katalog vom Hersteller</td></tr>
<tr><td>− Liefererrabatt 10 %</td><td>100,00 €</td><td>Du nimmst 10 Räder</td></tr>
<tr class="sum"><td>= Zieleinkaufspreis</td><td>900,00 €</td><td>Das steht auf der Rechnung</td></tr>
<tr><td>− Liefererskonto 2 %</td><td>18,00 €</td><td>Du zahlst schnell</td></tr>
<tr class="sum"><td>= Bareinkaufspreis</td><td>882,00 €</td><td>Das zahlst du wirklich</td></tr>
<tr><td>+ Bezugskosten</td><td>18,00 €</td><td>Die Spedition bringt das Rad</td></tr>
<tr class="sum"><td>= Bezugspreis</td><td>900,00 €</td><td>So viel kostet das Rad im Laden</td></tr>
<tr><td>+ Handlungskosten 30 %</td><td>270,00 €</td><td>Miete, Lohn, Strom</td></tr>
<tr class="sum"><td>= Selbstkosten</td><td>1.170,00 €</td><td>Darunter verlierst du Geld</td></tr>
<tr><td>+ Gewinn 10 %</td><td>117,00 €</td><td>Das willst du verdienen</td></tr>
<tr class="sum"><td>= Barverkaufspreis</td><td>1.287,00 €</td><td>Das soll in deiner Kasse landen</td></tr>
<tr><td>+ Kundenskonto 2 %</td><td>26,27 €</td><td>Der Kunde darf schnell zahlen und 2 % abziehen</td></tr>
<tr class="sum"><td>= Zielverkaufspreis</td><td>1.313,27 €</td><td>Preis, wenn er später zahlt</td></tr>
<tr><td>+ Kundenrabatt 10 %</td><td>145,92 €</td><td>Der Kunde bekommt 10 % Rabatt</td></tr>
<tr class="sum"><td>= Listenverkaufspreis netto</td><td>1.459,19 €</td><td>Dein Preis ohne Steuer</td></tr>
<tr><td>+ Umsatzsteuer 19 %</td><td>277,25 €</td><td>Steuer fürs Finanzamt</td></tr>
<tr class="sum"><td>= Listenverkaufspreis brutto</td><td>1.736,44 €</td><td>Das steht auf dem Preisschild</td></tr>
</table></div>
<p><b>Merke dir nur 3 Wörter:</b> <b>Liste</b> = Katalogpreis, <b>Ziel</b> = später zahlen, <b>Bar</b> = sofort zahlen.</p>
<p><b>„Lisa zahlt bar“:</b> L-Z-B = Liste, Ziel, Bar. Das ist der Einkauf. Beim Verkauf derselbe Satz rückwärts: Bar, Ziel, Liste.</p>
<p><b>Die Mitte:</b> Bezugspreis (was es kostet, bis ich es <i>bekomme</i>) → Selbstkosten (was es mich <i>selbst</i> kostet) → Gewinn (was ich <i>verdiene</i>).</p>
<p><b>Rabatt</b> steht immer neben „Liste“, <b>Skonto</b> immer neben „Bar“.</p></div>
<h3>Genauer erklärt</h3>
<p class="lead">Dieses Schema musst du in der Arbeit aus dem Kopf aufschreiben können, mit Rechenzeichen. Es gibt Punkte dafür. Es ist das Schema deiner Lehrerin, ergänzt um die Umsatzsteuer am Ende.</p>
<table class="tbl schema"><tr><th>Zeile</th><th>Wovon rechnen?</th></tr>
<tr><td>Listeneinkaufspreis</td><td>Startwert</td></tr>
<tr><td>− Liefererrabatt</td><td><mark class="vom">vom Hundert</mark> vom Listeneinkaufspreis</td></tr>
<tr class="sum"><td>= Zieleinkaufspreis</td><td></td></tr>
<tr><td>− Liefererskonto</td><td><mark class="vom">vom Hundert</mark> vom Zieleinkaufspreis</td></tr>
<tr class="sum"><td>= Bareinkaufspreis</td><td></td></tr>
<tr><td>+ Bezugskosten</td><td>fester Euro-Betrag</td></tr>
<tr class="sum"><td>= Bezugspreis (Einstandspreis)</td><td>Ende der Bezugskalkulation</td></tr>
<tr><td>+ Handlungskosten</td><td><mark class="vom">vom Hundert</mark> vom Bezugspreis</td></tr>
<tr class="sum"><td>= Selbstkosten</td><td></td></tr>
<tr><td>+ Gewinn</td><td><mark class="vom">vom Hundert</mark> von den Selbstkosten</td></tr>
<tr class="sum"><td>= Barverkaufspreis</td><td></td></tr>
<tr><td>+ Kundenskonto</td><td><mark class="im">im Hundert</mark></td></tr>
<tr><td>+ Vertreterprovision</td><td><mark class="im">im Hundert</mark></td></tr>
<tr class="sum"><td>= Zielverkaufspreis</td><td></td></tr>
<tr><td>+ Kundenrabatt</td><td><mark class="im">im Hundert</mark></td></tr>
<tr class="sum"><td>= Listenverkaufspreis (netto)</td><td></td></tr>
<tr><td>+ Umsatzsteuer 19 %</td><td>vom Nettopreis</td></tr>
<tr class="sum"><td>= Listenverkaufspreis (brutto)</td><td></td></tr>
</table>
<p>In der Arbeit schreibst du jede Zeile mit Text, Prozentsatz und Euro-Betrag hin, auch die Zwischensummen (Zeilen mit „=“). Das stand auf der Tafel: „mit Text + Zwischensummen“. Gibt es in einer Aufgabe zum Beispiel keine Provision, lässt du nur diese Zeile weg.</p>
<h3>Eselsbrücken</h3>
<ul>
<li><b>Spiegelbild:</b> Einkauf geht Liste → Ziel → Bar. Verkauf geht genau umgekehrt: Bar → Ziel → Liste.</li>
<li><b>Wer neben wem sitzt:</b> Rabatt steht immer neben einem Listenpreis, Skonto immer neben einem Barpreis.</li>
<li><b>Die Mitte:</b> Bezugspreis + Handlungskosten = Selbstkosten, + Gewinn = Barverkaufspreis. Erst die Kosten, dann der Gewinn.</li>
<li><b>Einkauf minus, Verkauf plus:</b> Beim Einkauf ziehst du Nachlässe ab. Beim Verkauf schlägst du sie vorher drauf, weil der Kunde sie später wieder abzieht.</li>
</ul>
<h3>Vom Hundert und im Hundert</h3>
<p>Beides ist Prozentrechnen. Der ganze Unterschied ist eine Frage: <b>Kennst du die 100 % schon oder nicht?</b></p>
<p><b>1. <mark class="vom">Vom Hundert</mark>: Du kennst die 100 % schon.</b> Das ist ganz normales Prozentrechnen, wie beim Einkaufen.</p>
<div class="ex"><b>Beispiel:</b> Ein Handy kostet 500 €, du bekommst 10 % Rabatt. 500 × 10 ÷ 100 = <b>50 €</b> Rabatt. Die 500 €, die du kennst, sind die 100 %. Du rechnest 10 % <b>von</b> diesen 500 €.</div>
<p>Im Fahrrad-Beispiel ist es genauso:</p>
<ul>
<li>10 % Rabatt <b>von</b> 1.000 € = 100 €</li>
<li>30 % Ladenkosten <b>von</b> 900 € = 270 €</li>
<li>10 % Gewinn <b>von</b> 1.170 € = 117 €</li>
</ul>
<p><b>2. <mark class="im">Im Hundert</mark>: Du kennst die 100 % noch nicht.</b> Du weißt nur, was <b>nach</b> dem Abzug übrig bleiben soll.</p>
<div class="ex"><b>Beispiel:</b> Du willst am Ende 1.287 € in der Kasse haben. Der Kunde darf später noch 2 % Skonto abziehen. Deine 1.287 € sind also nur <b>98 %</b> vom Preis, den du verlangen musst. Deshalb: 1.287 ÷ 0,98 = <b>1.313,27 €</b>.<br>Probe: 2 % von 1.313,27 € sind 26,27 €. 1.313,27 − 26,27 = 1.287,00 €. Passt!</div>
<p><b>Warum nicht einfach 2 % draufrechnen?</b> Weil der Kunde die 2 % vom <b>größeren</b> Preis abzieht. Dann fehlt dir Geld:</p>
<table class="tbl"><tr><th></th><th>Falsch: 2 % drauf</th><th>Richtig: ÷ 0,98</th></tr>
<tr><td>Du willst haben</td><td>1.287,00 €</td><td>1.287,00 €</td></tr>
<tr><td>Preis für den Kunden</td><td>1.287 + 25,74 = 1.312,74 €</td><td>1.287 ÷ 0,98 = 1.313,27 €</td></tr>
<tr><td>Kunde zieht 2 % ab</td><td>− 26,25 €</td><td>− 26,27 €</td></tr>
<tr class="sum"><td>Du bekommst</td><td>1.286,49 € (zu wenig)</td><td>1.287,00 €</td></tr>
</table>
<h3>Die Kurzregel</h3>
<table class="tbl"><tr><th></th><th>Wann?</th><th>Taschenrechner</th></tr>
<tr><td><mark class="vom">vom Hundert</mark></td><td>Liefererrabatt, Liefererskonto, Handlungskosten, Gewinn, Umsatzsteuer</td><td><b>mal</b>: 1.000 × 0,10</td></tr>
<tr><td><mark class="im">im Hundert</mark></td><td>nur Kundenskonto, Vertreterprovision, Kundenrabatt</td><td><b>geteilt</b>: 1.287 ÷ 0,98</td></tr>
</table>
<div class="tip"><b>Merke:</b> Kennst du den Anfang, rechnest du <b>mal</b>. Kennst du nur das Ende, rechnest du <b>geteilt</b>.<br>Gibt es Kundenskonto und Provision gleichzeitig, zählst du beide zusammen: 2 % + 5 % = 7 %, also ÷ 0,93.<br>Bei der Rückwärtskalkulation drehen sich die beiden um. Das steht auf der Seite „Rückwärtskalkulation“.</div>
<p><b>Runden:</b> Jeden Zwischenschritt auf 2 Stellen nach dem Komma runden und mit dem gerundeten Wert weiterrechnen. Weicht dein Ergebnis um 1 Cent ab, liegt es meist nur am Runden.</p>` },

{ id: 'bezug', title: 'Bezugskalkulation', short: 'Angebote nach dem Preis vergleichen', html: `
<div class="easy"><h3>Einfach erklärt</h3>
<p>Zwei Hersteller bieten dir dasselbe Rad an. Welcher bringt es dir am billigsten in den Laden?</p>
<div class="tbl-wrap"><table class="tbl num"><tr><th></th><th>Hersteller A</th><th>Hersteller B</th></tr>
<tr><td>Katalogpreis</td><td>1.000,00 €</td><td>950,00 €</td></tr>
<tr><td>− Rabatt</td><td>10 % = 100,00 €</td><td>kein Rabatt</td></tr>
<tr><td>− Skonto 2 %</td><td>18,00 €</td><td>19,00 €</td></tr>
<tr><td>+ Versand</td><td>18,00 €</td><td>0,00 € (frei Haus)</td></tr>
<tr class="sum"><td>= Bezugspreis</td><td><b>900,00 €</b></td><td>931,00 €</td></tr>
</table></div>
<p>A hat den höheren Katalogpreis, ist am Ende aber <b>31 € billiger</b>.</p>
<p><b>Merke:</b> Nicht der Katalogpreis zählt, sondern was das Rad wirklich kostet, bis es im Laden steht.</p></div>
<h3>Genauer erklärt</h3>
<p class="lead"><b>Quantitativ</b> vergleichen heißt: Du vergleichst nur Zahlen, also den Preis. Du rechnest für jedes Angebot die ersten 7 Zeilen des Schemas aus. Am günstigsten ist das Angebot mit dem niedrigsten Bezugspreis. Auf der Tafel stand dafür „Kalkulation bis zum Einstandspreis“.</p>
<p>Warum nicht einfach die Listenpreise vergleichen? Weil Rabatt, Skonto und Versand bei jedem Lieferanten anders sind. Ein teurer Listenpreis mit hohem Rabatt kann am Ende billiger sein.</p>
<h3>So gehst du vor</h3>
<ol>
<li>Aus jedem Angebot heraussuchen: Listenpreis, Rabatt in %, Skonto in %, Versandkosten.</li>
<li>Alles auf ein Stück umrechnen. „Transportkosten gesamt 150 €“ für 100 Stück sind 1,50 € pro Stück.</li>
<li>Tabelle zeichnen: links die Begriffe, oben eine Spalte pro Angebot.</li>
<li>Rabatt vom Listenpreis, dann Skonto vom Zieleinkaufspreis rechnen. Nicht vom Listenpreis!</li>
<li>Bezugskosten dazu, Bezugspreise vergleichen, Antwortsatz schreiben.</li>
</ol>
<h3>Beispiel aus deiner LS2: drei Laptop-Angebote</h3>
<table class="tbl num"><tr><th>Begriff</th><th>Kröner</th><th>Haußer</th><th>Lechner</th></tr>
<tr><td>Listeneinkaufspreis</td><td>635,00 €</td><td>1.015,00 €</td><td>886,00 €</td></tr>
<tr><td>− Liefererrabatt</td><td>10 % = 63,50 €</td><td>20 % = 203,00 €</td><td>0,00 €</td></tr>
<tr class="sum"><td>= Zieleinkaufspreis</td><td>571,50 €</td><td>812,00 €</td><td>886,00 €</td></tr>
<tr><td>− Liefererskonto</td><td>3 % = 17,15 €</td><td>2 % = 16,24 €</td><td>2 % = 17,72 €</td></tr>
<tr class="sum"><td>= Bareinkaufspreis</td><td>554,35 €</td><td>795,76 €</td><td>868,28 €</td></tr>
<tr><td>+ Bezugskosten</td><td>5,00 €</td><td>6,90 €</td><td>4,90 €</td></tr>
<tr class="sum"><td>= Bezugspreis</td><td><b>559,35 €</b></td><td>802,66 €</td><td>873,18 €</td></tr>
</table>
<p><b>Antwortsatz:</b> Rein vom Preis her ist das Angebot von Kröner PC mit 559,35 € pro Laptop am günstigsten.</p>
<p>Trotzdem wurde in deinem Unterricht Hardware Haußer gewählt. Warum, erfährst du beim qualitativen Vergleich: Der Preis ist nicht alles.</p>
<h3>Typische Fehler</h3>
<ul>
<li>Skonto vom Listenpreis rechnen statt vom Zieleinkaufspreis.</li>
<li>Versandkosten „gesamt“ nicht durch die Stückzahl teilen.</li>
<li>Bruttopreise mit Nettopreisen mischen. Beim Vergleich rechnest du immer netto.</li>
<li>Den Antwortsatz vergessen. Der gibt oft einen eigenen Punkt.</li>
</ul>` },

{ id: 'quali', title: 'Qualitativer Vergleich', short: 'Nutzwerttabelle, Entscheidungstabelle, Scoring', html: `
<div class="easy"><h3>Einfach erklärt</h3>
<p>Wie beim Handykauf: Du schaust nicht nur auf den Preis, sondern auch auf Kamera und Akku. Was dir wichtiger ist, zählt mehr.</p>
<p>Beispiel: Hersteller A ist billiger, liefert aber erst in 6 Wochen. Hersteller B ist teurer, liefert morgen. Dir sind beide Punkte gleich wichtig (je 50).</p>
<div class="tbl-wrap"><table class="tbl num"><tr><th>Kriterium</th><th>Gewicht</th><th>A</th><th>B</th></tr>
<tr><td>Preis</td><td>50</td><td>5 Punkte → 250</td><td>3 Punkte → 150</td></tr>
<tr><td>Lieferzeit</td><td>50</td><td>1 Punkt → 50</td><td>5 Punkte → 250</td></tr>
<tr class="sum"><td>Summe</td><td>100</td><td>300</td><td><b>400</b></td></tr>
</table></div>
<p><b>Merke:</b> Gewicht × Punkte, alles zusammenzählen, die höchste Zahl gewinnt. Nutzwerttabelle, Entscheidungstabelle und Scoring heißen nur anders.</p></div>
<h3>Genauer erklärt</h3>
<p class="lead"><b>Qualitativ</b> vergleichen heißt: Du bewertest auch Dinge, die kein Preis sind, etwa Lieferzeit, Zuverlässigkeit oder Nachhaltigkeit. Damit man das in Zahlen fassen kann, gibt es ein Punkteverfahren.</p>
<p>Auf der Tafel stehen drei Namen: Nutzwerttabelle, Entscheidungstabelle, Scoring-Verfahren. In deinen Unterlagen funktionieren alle drei nach demselben Prinzip. In der LS2 heißt es „Entscheidungsmatrix“, in der IHK-Aufgabe „Nutzwertanalyse“. „Scoring“ kommt vom englischen Wort für Punktestand. Falls deine Lehrerin die drei unterschieden hat, gilt ihre Version.</p>
<h3>Die 5 Schritte</h3>
<ol>
<li><b>Kriterien festlegen:</b> Was ist wichtig? Preis, Lieferzeit, Zuverlässigkeit, Qualität, Nachhaltigkeit …</li>
<li><b>Gewichten:</b> Jedes Kriterium bekommt eine Gewichtung. Alle zusammen ergeben 100.</li>
<li><b>Punkte vergeben:</b> Jedes Angebot bekommt pro Kriterium 1 bis 5 Punkte (1 = schlecht, 5 = sehr gut).</li>
<li><b>Gewichtete Punkte:</b> Punkte × Gewichtung.</li>
<li><b>Summe bilden:</b> Das Angebot mit der höchsten Summe gewinnt.</li>
</ol>
<h3>Beispiel: die drei Laptops</h3>
<p>Gewichtung und Punkte sind hier als Beispiel gewählt. In der Arbeit begründest du deine eigene Wahl, etwa mit den Angeboten, der Lieferantenliste (Rating A/B) und dem Leitbild der IT Sol.</p>
<table class="tbl num"><tr><th>Kriterium</th><th>Gewicht</th><th>Kröner</th><th>Haußer</th><th>Lechner</th></tr>
<tr><td>Preis</td><td>30</td><td>5 → 150</td><td>4 → 120</td><td>3 → 90</td></tr>
<tr><td>Lieferzeit</td><td>20</td><td>1 → 20</td><td>5 → 100</td><td>4 → 80</td></tr>
<tr><td>Zuverlässigkeit</td><td>20</td><td>5 → 100</td><td>5 → 100</td><td>3 → 60</td></tr>
<tr><td>Nachhaltigkeit</td><td>15</td><td>1 → 15</td><td>5 → 75</td><td>1 → 15</td></tr>
<tr><td>Technik</td><td>15</td><td>3 → 45</td><td>3 → 45</td><td>4 → 60</td></tr>
<tr class="sum"><td>Summe</td><td>100</td><td>330</td><td><b>440</b></td><td>305</td></tr>
</table>
<p><b>Ergebnis:</b> Hardware Haußer gewinnt mit 440 Punkten, obwohl Kröner billiger ist.</p>
<h3>Das musst du in Worten können</h3>
<p><b>Wie funktioniert die Nutzwertanalyse?</b> Man legt Kriterien fest und gewichtet sie nach Wichtigkeit (zusammen 100 %). Dann bewertet man jedes Angebot pro Kriterium mit Punkten, multipliziert Punkte mit Gewichtung und addiert. Das Angebot mit dem höchsten Nutzwert wird gewählt.</p>
<p><b>Warum ist sie hilfreich?</b> Sie macht auch nicht messbare Dinge vergleichbar. Die Entscheidung wird nachvollziehbar und sachlich begründet statt aus dem Bauch heraus.</p>
<p><b>Kriterien neben dem Preis:</b> Lieferzeit und Termintreue, Qualität der Ware, Zuverlässigkeit und bisherige Erfahrungen, Zahlungsbedingungen, Service und Garantie, Nachhaltigkeit und faire Herstellung, Nähe des Lieferanten.</p>` },

{ id: 'vor', title: 'Vorwärtskalkulation', short: 'Vom Einkaufspreis zum Verkaufspreis', html: `
<div class="easy"><h3>Einfach erklärt</h3>
<p>Du hast das Rad eingekauft. Jetzt fragst du dich: <b>Was schreibe ich aufs Preisschild?</b> Du gehst die Fahrrad-Geschichte von oben nach unten durch, bis du bei 1.736,44 € brutto bist (siehe „Kalkulationsschema“).</p>
<p><b>Der einzige Trick ist „im Hundert“:</b> Dein Kunde nimmt sich später sein Skonto vom Preis auf der Rechnung. Wenn du einfach 2 % auf 1.287 € draufpackst, nimmt er 2 % vom größeren Betrag weg, und dir fehlt Geld.</p>
<p>Deshalb <b>teilst</b> du: 1.287,00 ÷ 0,98 = 1.313,27 €. Zieht der Kunde jetzt 2 % ab, bleiben genau 1.287,00 € übrig.</p>
<p><b>Merke:</b> Beim Einkauf und bei Kosten/Gewinn: mal Prozent. Bei Kundenskonto, Provision und Kundenrabatt: teilen durch (1 − Prozent).</p></div>
<h3>Genauer erklärt</h3>
<p class="lead">Bei der Vorwärtskalkulation rechnest du das ganze Schema von oben nach unten. Am Ende weißt du, zu welchem Preis du die Ware deinem Kunden anbieten musst. In LS3 heißt das auch Angebotskalkulation.</p>
<h3>Komplettes Beispiel</h3>
<p>Ein Händler kauft einen Monitor. Listeneinkaufspreis 500,00 €, Liefererrabatt 20 %, Liefererskonto 2 %, Versand 12,00 €. Handlungskosten 30 %, Gewinn 10 %, Kundenskonto 2 %, Vertreterprovision 5 %, Kundenrabatt 10 %, Umsatzsteuer 19 %.</p>
<table class="tbl num"><tr><th>Begriff</th><th>Satz</th><th>Betrag</th><th>So gerechnet</th></tr>
<tr><td>Listeneinkaufspreis</td><td></td><td>500,00 €</td><td>aus dem Angebot</td></tr>
<tr><td>− Liefererrabatt</td><td>20 %</td><td>100,00 €</td><td>500 × 20 ÷ 100</td></tr>
<tr class="sum"><td>= Zieleinkaufspreis</td><td></td><td>400,00 €</td><td>500 − 100</td></tr>
<tr><td>− Liefererskonto</td><td>2 %</td><td>8,00 €</td><td>400 × 2 ÷ 100</td></tr>
<tr class="sum"><td>= Bareinkaufspreis</td><td></td><td>392,00 €</td><td>400 − 8</td></tr>
<tr><td>+ Bezugskosten</td><td></td><td>12,00 €</td><td>Versand</td></tr>
<tr class="sum"><td>= Bezugspreis</td><td></td><td>404,00 €</td><td>392 + 12</td></tr>
<tr><td>+ Handlungskosten</td><td>30 %</td><td>121,20 €</td><td>404 × 30 ÷ 100</td></tr>
<tr class="sum"><td>= Selbstkosten</td><td></td><td>525,20 €</td><td>404 + 121,20</td></tr>
<tr><td>+ Gewinn</td><td>10 %</td><td>52,52 €</td><td>525,20 × 10 ÷ 100</td></tr>
<tr class="sum"><td>= Barverkaufspreis</td><td></td><td>577,72 €</td><td>525,20 + 52,52</td></tr>
<tr><td>+ Kundenskonto</td><td>2 %</td><td>12,42 €</td><td>2 % von 621,20</td></tr>
<tr><td>+ Vertreterprovision</td><td>5 %</td><td>31,06 €</td><td>5 % von 621,20</td></tr>
<tr class="sum"><td>= Zielverkaufspreis</td><td></td><td>621,20 €</td><td><mark class="im">im Hundert</mark>: 577,72 ÷ 93 × 100</td></tr>
<tr><td>+ Kundenrabatt</td><td>10 %</td><td>69,02 €</td><td>690,22 − 621,20</td></tr>
<tr class="sum"><td>= Listenverkaufspreis (netto)</td><td></td><td>690,22 €</td><td><mark class="im">im Hundert</mark>: 621,20 ÷ 90 × 100</td></tr>
<tr><td>+ Umsatzsteuer</td><td>19 %</td><td>131,14 €</td><td>690,22 × 19 ÷ 100</td></tr>
<tr class="sum"><td>= Listenverkaufspreis (brutto)</td><td></td><td>821,36 €</td><td>690,22 + 131,14</td></tr>
</table>
<h3>Reihenfolge bei „im Hundert“</h3>
<ol>
<li>Skonto und Provision zusammenzählen: 2 % + 5 % = 7 %. Der Barverkaufspreis ist also 93 %.</li>
<li>Zielverkaufspreis = 577,72 ÷ 93 × 100 = 621,20 €.</li>
<li>Erst jetzt Skonto und Provision ausrechnen: 2 % und 5 % von 621,20 €.</li>
<li>Kontrolle: 577,72 + 12,42 + 31,06 = 621,20. Passt.</li>
<li>Beim Kundenrabatt genauso: 621,20 ÷ 90 × 100 = 690,22 €.</li>
</ol>
<h3>Typische Fehler</h3>
<ul>
<li>Kundenskonto oder Kundenrabatt „vom Hundert“ draufrechnen. Dann bekommst du am Ende zu wenig.</li>
<li>Handlungskosten vom Bareinkaufspreis statt vom Bezugspreis rechnen.</li>
<li>Gewinn vom Bezugspreis statt von den Selbstkosten rechnen.</li>
</ul>
<div class="tip">Die Prozubi-Blätter nutzen ein verkürztes Schema ohne Kundenskonto und Kundenrabatt. Zum Üben ist das okay. In der Klassenarbeit nimmst du das vollständige Schema.</div>` },

{ id: 'rueck', title: 'Rückwärtskalkulation', short: 'Wie viel darf der Einkauf kosten?', html: `
<div class="easy"><h3>Einfach erklärt</h3>
<p>Der Laden nebenan verkauft das gleiche Rad für <b>1.736,44 €</b>. Du willst nicht teurer sein. <b>Wie viel darfst du beim Hersteller höchstens zahlen?</b> Du gehst die Fahrrad-Geschichte einfach rückwärts, vom Preisschild zum Katalog:</p>
<div class="tbl-wrap"><table class="tbl num"><tr><th>Schritt</th><th>Rechnung</th><th>Ergebnis</th></tr>
<tr><td>Steuer raus</td><td>1.736,44 ÷ 1,19</td><td>1.459,19 €</td></tr>
<tr><td>Kundenrabatt raus</td><td>− 10 % (145,92)</td><td>1.313,27 €</td></tr>
<tr><td>Kundenskonto raus</td><td>− 2 % (26,27)</td><td>1.287,00 €</td></tr>
<tr><td>Gewinn raus</td><td>÷ 1,10</td><td>1.170,00 €</td></tr>
<tr><td>Ladenkosten raus</td><td>÷ 1,30</td><td>900,00 €</td></tr>
<tr><td>Versand raus</td><td>− 18,00</td><td>882,00 €</td></tr>
<tr><td>Skonto zurück</td><td>÷ 0,98</td><td>900,00 €</td></tr>
<tr class="sum"><td>Rabatt zurück</td><td>÷ 0,90</td><td><b>1.000,00 €</b></td></tr>
</table></div>
<p>Du landest genau wieder beim Katalogpreis von 1.000 €. Mehr darf der Hersteller nicht verlangen.</p>
<p><b>Merke:</b> Was vorwärts „+ Prozent“ war, teilst du durch (1 + Prozent). Was vorwärts „− Prozent“ war, teilst du durch (1 − Prozent). Nur Kundenrabatt und Kundenskonto ziehst du einfach ab.</p></div>
<h3>Genauer erklärt</h3>
<p class="lead">Du kennst den Verkaufspreis, weil die Konkurrenz ihn vorgibt. Du willst wissen: Wie viel darf ich beim Einkauf höchstens zahlen, damit Kosten und Gewinn noch drin sind? Du rechnest dasselbe Schema, nur von unten nach oben.</p>
<h3>Die Umkehr-Regel</h3>
<p>Rückwärts tauschen „vom Hundert“ und „im Hundert“ die Rollen. Du kennst jetzt immer den Wert unter der Zeile, nicht den darüber.</p>
<table class="tbl"><tr><th>Zeile</th><th>Vorwärts</th><th>Rückwärts</th></tr>
<tr><td>Umsatzsteuer</td><td>netto × 1,19</td><td>brutto ÷ 1,19</td></tr>
<tr><td>Kundenrabatt 10 %</td><td>÷ 0,90 (im Hundert)</td><td>Listenpreis × 10 % abziehen</td></tr>
<tr><td>Kundenskonto 2 %</td><td>÷ 0,98 (im Hundert)</td><td>Zielverkaufspreis × 2 % abziehen</td></tr>
<tr><td>Gewinn 10 %</td><td>Selbstkosten × 10 %</td><td>Barverkaufspreis ÷ 1,10</td></tr>
<tr><td>Handlungskosten 30 %</td><td>Bezugspreis × 30 %</td><td>Selbstkosten ÷ 1,30</td></tr>
<tr><td>Bezugskosten</td><td>+ Euro</td><td>− Euro</td></tr>
<tr><td>Liefererskonto 2 %</td><td>Zieleinkaufspreis × 2 %</td><td>Bareinkaufspreis ÷ 0,98</td></tr>
<tr><td>Liefererrabatt 20 %</td><td>Listenpreis × 20 %</td><td>Zieleinkaufspreis ÷ 0,80</td></tr>
</table>
<div class="tip"><b>Merke:</b> Was vorwärts „plus Prozent“ war, teilst du rückwärts durch (1 + Prozent). Was vorwärts „minus Prozent“ war, teilst du rückwärts durch (1 − Prozent). Nur Kundenrabatt und Kundenskonto ziehst du rückwärts ganz normal ab.</div>
<h3>Beispiel</h3>
<p>Die Konkurrenz verkauft einen Monitor für 595,00 € brutto. Du gibst 10 % Kundenrabatt und 2 % Kundenskonto. Gewinn 10 %, Handlungskosten 30 %, Versand 12,00 €. Dein Lieferant gibt 20 % Rabatt und 2 % Skonto.</p>
<table class="tbl num"><tr><th>Schritt</th><th>Rechnung</th><th>Ergebnis</th></tr>
<tr><td>1. Netto</td><td>595,00 ÷ 1,19</td><td>500,00 €</td></tr>
<tr><td>2. − Kundenrabatt 10 %</td><td>500,00 × 10 % = 50,00</td><td>Zielverkaufspreis 450,00 €</td></tr>
<tr><td>3. − Kundenskonto 2 %</td><td>450,00 × 2 % = 9,00</td><td>Barverkaufspreis 441,00 €</td></tr>
<tr><td>4. Selbstkosten</td><td>441,00 ÷ 1,10</td><td>400,91 €</td></tr>
<tr><td>5. Bezugspreis</td><td>400,91 ÷ 1,30</td><td>308,39 €</td></tr>
<tr><td>6. − Bezugskosten</td><td>308,39 − 12,00</td><td>Bareinkaufspreis 296,39 €</td></tr>
<tr><td>7. Zieleinkaufspreis</td><td>296,39 ÷ 0,98</td><td>302,44 €</td></tr>
<tr class="sum"><td>8. Listeneinkaufspreis</td><td>302,44 ÷ 0,80</td><td><b>378,05 €</b></td></tr>
</table>
<p><b>Antwortsatz:</b> Der Listeneinkaufspreis darf höchstens 378,05 € betragen.</p>
<p>In der Arbeit schreibst du alles ins normale Schema (Listeneinkaufspreis oben, Bruttopreis unten) und füllst es von unten nach oben aus. Ein Pfeil nach oben neben der Tabelle zeigt die Richtung.</p>` },

{ id: 'diff', title: 'Differenzkalkulation', short: 'Wie viel Gewinn bleibt übrig?', html: `
<div class="easy"><h3>Einfach erklärt</h3>
<p>Der Hersteller verlangt 1.000 € (10 % Rabatt, 2 % Skonto, 18 € Versand), dein Laden hat 30 % Kosten. Die Konkurrenz verkauft das Rad für 1.547,00 € brutto. <b>Bleibt dir was übrig?</b></p>
<ul>
<li><b>Von oben</b> rechnest du bis zu den Selbstkosten: <b>1.170,00 €</b>.</li>
<li><b>Von unten</b> rechnest du bis zum Barverkaufspreis: 1.547,00 ÷ 1,19 = <b>1.300,00 €</b>.</li>
<li><b>Die Lücke dazwischen</b> ist dein Gewinn: 1.300 − 1.170 = <b>130,00 €</b>.</li>
<li>In Prozent: 130 ÷ 1.170 × 100 = <b>11,11 %</b>.</li>
</ul>
<p><b>Merke:</b> Oben bis Selbstkosten, unten bis Barverkaufspreis, der Gewinn ist die Lücke. Ist die Lücke negativ, machst du Verlust.</p></div>
<h3>Genauer erklärt</h3>
<p class="lead">Du kennst Einkaufspreis und Verkaufspreis. Die Frage ist: Wie viel Gewinn bleibt übrig, und lohnt sich das? „Differenz“ heißt Unterschied. Der Gewinn ist genau der Unterschied zwischen zwei Zeilen.</p>
<h3>So gehst du vor</h3>
<ol>
<li>Von oben vorwärts rechnen bis zu den Selbstkosten.</li>
<li>Von unten rückwärts rechnen bis zum Barverkaufspreis.</li>
<li>Gewinn = Barverkaufspreis − Selbstkosten.</li>
<li>Gewinnzuschlag in % = Gewinn ÷ Selbstkosten × 100.</li>
<li>Antwortsatz: Reicht der Gewinn? Ist er negativ, ist es ein Verlust.</li>
</ol>
<h3>Beispiel</h3>
<p>Einkauf: Listeneinkaufspreis 400,00 €, 10 % Rabatt, 2 % Skonto, 10,00 € Versand, Handlungskosten 25 %. Verkauf: Die Konkurrenz verlangt 714,00 € brutto. Du gibst 5 % Kundenrabatt und 2 % Kundenskonto.</p>
<table class="tbl num"><tr><th>Begriff</th><th>Satz</th><th>Betrag</th><th>Richtung</th></tr>
<tr><td>Listeneinkaufspreis</td><td></td><td>400,00 €</td><td>↓</td></tr>
<tr><td>− Liefererrabatt</td><td>10 %</td><td>40,00 €</td><td>↓</td></tr>
<tr class="sum"><td>= Zieleinkaufspreis</td><td></td><td>360,00 €</td><td>↓</td></tr>
<tr><td>− Liefererskonto</td><td>2 %</td><td>7,20 €</td><td>↓</td></tr>
<tr class="sum"><td>= Bareinkaufspreis</td><td></td><td>352,80 €</td><td>↓</td></tr>
<tr><td>+ Bezugskosten</td><td></td><td>10,00 €</td><td>↓</td></tr>
<tr class="sum"><td>= Bezugspreis</td><td></td><td>362,80 €</td><td>↓</td></tr>
<tr><td>+ Handlungskosten</td><td>25 %</td><td>90,70 €</td><td>↓</td></tr>
<tr class="sum"><td>= Selbstkosten</td><td></td><td><b>453,50 €</b></td><td>Ende oben</td></tr>
<tr class="hl"><td>+ Gewinn</td><td>23,18 %</td><td><b>105,10 €</b></td><td>558,60 − 453,50</td></tr>
<tr class="sum"><td>= Barverkaufspreis</td><td></td><td><b>558,60 €</b></td><td>Ende unten</td></tr>
<tr><td>+ Kundenskonto</td><td>2 %</td><td>11,40 €</td><td>↑ 570,00 × 2 %</td></tr>
<tr class="sum"><td>= Zielverkaufspreis</td><td></td><td>570,00 €</td><td>↑</td></tr>
<tr><td>+ Kundenrabatt</td><td>5 %</td><td>30,00 €</td><td>↑ 600,00 × 5 %</td></tr>
<tr class="sum"><td>= Listenverkaufspreis (netto)</td><td></td><td>600,00 €</td><td>↑ 714,00 ÷ 1,19</td></tr>
<tr><td>+ Umsatzsteuer</td><td>19 %</td><td>114,00 €</td><td>↑</td></tr>
<tr class="sum"><td>= Listenverkaufspreis (brutto)</td><td></td><td>714,00 €</td><td>↑</td></tr>
</table>
<p>Gewinnzuschlag: 105,10 ÷ 453,50 × 100 = 23,18 %.</p>
<p><b>Antwortsatz:</b> Pro Stück bleiben 105,10 € Gewinn, das sind 23,18 %.</p>
<h3>Typische Fehler</h3>
<ul>
<li>Den Gewinnzuschlag durch den Barverkaufspreis teilen statt durch die Selbstkosten.</li>
<li>Unten „im Hundert“ rechnen. Von unten kennst du den größeren Wert schon, normales Prozentrechnen reicht.</li>
<li>Den Antwortsatz vergessen, vor allem bei einem Verlust.</li>
</ul>` },

{ id: 'recht', title: 'Kaufvertrag', short: '1. und 2. Willenserklärung', html: `
<div class="easy"><h3>Einfach erklärt</h3>
<p>Ein Kaufvertrag ist wie ein <b>Handschlag</b>: Einer streckt die Hand aus (<b>Antrag</b> = 1. Willenserklärung), der andere schlägt ein (<b>Annahme</b> = 2. Willenserklärung).</p>
<ul>
<li>Der Fahrradladen schreibt dir: „Rad X für 1.459 €.“ Er streckt <b>dir</b> die Hand hin. Das ist ein <b>Angebot</b>.</li>
<li>Du sagst rechtzeitig: „Nehm ich.“ Du schlägst ein. <b>Vertrag!</b></li>
<li>Du sagst: „Nehm ich, aber für 1.300 €.“ Das ist kein Einschlagen, sondern eine <b>neue</b> ausgestreckte Hand. Noch kein Vertrag.</li>
<li>Ein Plakat oder Prospekt streckt <b>niemandem</b> die Hand hin, es zeigt nur. Das ist eine <b>Anpreisung</b>.</li>
</ul>
<p><b>Wie lange bleibt die Hand ausgestreckt?</b> Am Telefon nur während des Gesprächs, beim Brief ungefähr eine Woche.</p>
<p><b>Nach dem Handschlag:</b> Der Laden gibt dir das Rad, heil, und es gehört dann dir. Du zahlst und holst es ab.</p></div>
<h3>Genauer erklärt</h3>
<p class="lead">Ein Kaufvertrag kommt zustande, wenn zwei passende Willenserklärungen zusammenkommen. Auf der Tafel stand dafür „1. WE / 2. WE“.</p>
<ul>
<li><b>Willenserklärung (WE):</b> Jemand sagt oder schreibt verbindlich, was er rechtlich will. „Ich verkaufe dir das“ oder „Ich kaufe das“.</li>
<li><b>1. Willenserklärung = Antrag:</b> Der Erste macht den Vorschlag.</li>
<li><b>2. Willenserklärung = Annahme:</b> Der Zweite sagt Ja, und zwar genau zu diesem Inhalt und rechtzeitig.</li>
<li>Erst wenn beide vorliegen, ist der Vertrag geschlossen.</li>
</ul>
<h3>Zwei Wege zum Kaufvertrag</h3>
<table class="tbl"><tr><th></th><th>1. WE (Antrag)</th><th>2. WE (Annahme)</th></tr>
<tr><td>Verkäufer fängt an</td><td>verbindliches Angebot</td><td>Bestellung, gleicher Inhalt, rechtzeitig</td></tr>
<tr><td>Käufer fängt an</td><td>Bestellung ohne (verbindliches) Angebot</td><td>Auftragsbestätigung oder Lieferung</td></tr>
</table>
<h3>Anfrage, Angebot, Anpreisung</h3>
<table class="tbl"><tr><th>Begriff</th><th>Was ist das?</th><th>Verbindlich?</th></tr>
<tr><td>Anfrage</td><td>Bitte um Informationen: „Was kostet ein Laptop bei Ihnen?“</td><td>Nein</td></tr>
<tr><td>Angebot</td><td>An eine bestimmte Person oder Firma, mit Ware, Preis, Bedingungen</td><td>Ja, 1. WE</td></tr>
<tr><td>Anpreisung</td><td>Werbung an alle: Prospekt, Anzeige, Schaufenster, Internet</td><td>Nein</td></tr>
</table>
<div class="ex"><b>Beispiel LS3:</b> Der Media-Markt-Prospekt ist kein Angebot im rechtlichen Sinn, sondern eine Anpreisung. Er richtet sich an alle. Das Angebot von Hardware Haußer ist an die IT Sol GmbH gerichtet und deshalb verbindlich.</div>
<h3>Wie lange gilt ein Angebot?</h3>
<ul>
<li><b>Mündlich oder am Telefon:</b> nur solange das Gespräch dauert.</li>
<li><b>Brief ohne Frist:</b> solange man normalerweise mit einer Antwort rechnen kann, ca. eine Woche.</li>
<li><b>Mit Frist</b> („gültig bis 31.10.“): bis zu diesem Datum.</li>
</ul>
<p>Die Bindung endet, wenn der Kunde ablehnt, verändert annimmt oder zu spät antwortet.</p>
<h3>Freizeichnungsklauseln</h3>
<table class="tbl"><tr><th>Klausel</th><th>Verbindlich bleibt</th><th>Unverbindlich ist</th></tr>
<tr><td>freibleibend, unverbindlich, ohne Obligo</td><td>nichts</td><td>alles</td></tr>
<tr><td>solange der Vorrat reicht</td><td>Preis, Lieferzeit</td><td>Menge</td></tr>
<tr><td>Preis freibleibend</td><td>Lieferzeit, Menge</td><td>Preis</td></tr>
<tr><td>Lieferzeit freibleibend</td><td>Preis, Menge</td><td>Lieferzeit</td></tr>
</table>
<h3>Was ist eine Bestellung rechtlich?</h3>
<table class="tbl"><tr><th>Lage</th><th>Bestellung ist …</th><th>Vertrag?</th></tr>
<tr><td>Kein Angebot vorher oder nur ein unverbindliches</td><td>1. WE (Antrag)</td><td>noch nicht</td></tr>
<tr><td>Auf verbindliches Angebot, gleicher Inhalt, rechtzeitig</td><td>2. WE (Annahme)</td><td>ja</td></tr>
<tr><td>Zu spät oder mit geändertem Inhalt</td><td>neuer Antrag</td><td>noch nicht</td></tr>
</table>
<h3>Pflichten aus dem Kaufvertrag (§ 433 BGB)</h3>
<table class="tbl"><tr><th>Verkäufer muss</th><th>Käufer muss</th></tr>
<tr><td>die Ware übergeben</td><td>den Kaufpreis zahlen</td></tr>
<tr><td>das Eigentum verschaffen</td><td>die Ware abnehmen</td></tr>
<tr><td>frei von Sach- und Rechtsmängeln liefern</td><td></td></tr>
</table>
<p>Sachmangel: Die Ware ist kaputt oder falsch. Rechtsmangel: Die Ware gehört zum Beispiel jemand anderem.</p>
<h3>Was in ein vollständiges Angebot gehört</h3>

    `<p><b>Schritt für Schritt:</b> Ein Schuhladen kauft Sneaker ein.</p><ul><li>Listenpreis im Katalog: 80,00 €</li><li>− 10 % Rabatt (8,00 €) = 72,00 € Zieleinkaufspreis</li><li>− 2 % Skonto (1,44 €) = 70,56 € Bareinkaufspreis</li><li>+ 4,44 € Versand = 75,00 € Bezugspreis</li></ul><p>Dazu kommen die <b>Handlungskosten</b> des Ladens (Miete, Lohn, Strom). Zusammen ergibt das die <b>Selbstkosten</b>. Erst was darüber liegt, ist <b>Gewinn</b>.</p><p><b>Merke:</b> Jeder Begriff ist ein Zwischenstand auf dem Weg vom Katalog bis zum Preisschild.</p>`,
    `<p><b>Eselsbrücken:</b></p><ul><li><b>Brutto</b> = mit allem, also mit Steuer. <b>Netto</b> = nur die Ware.</li><li><b>Rabatt</b> wie „Rudel“: viele Stück, darum billiger.</li><li><b>Skonto</b> wie „schnell“: beide fangen mit S an.</li><li><b>Bezugspreis</b> = Preis bis vor deine Ladentür.</li><li><b>Selbstkosten</b> = deine Schmerzgrenze. Darunter verlierst du Geld.</li></ul><p><b>Merke:</b> Rudel gibt Rabatt, schnell gibt Skonto.</p>`,
